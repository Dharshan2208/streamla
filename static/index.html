<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Streamla — Watch Party</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Header bar -->
      <header class="navbar">
        <div class="brand">Streamla</div>
        <div style="display: flex; gap: 8px; align-items: center;">
          <div id="sync-badge" class="badge hidden">
            <span id="sync-status">Sync: Locked</span>
          </div>
          <div id="room-badge" class="badge hidden">
            Room: <span id="room-id"></span>
            <button id="copy-btn" title="Copy Invite Link">Copy</button>
          </div>
          <div id="viewers-badge" class="badge hidden">
            Viewers: <span id="viewer-count">1</span>
          </div>
        </div>
      </header>

      <!-- Main Player Area -->
      <main class="player-container">
        <!-- Welcome / Join / Upload Card -->
        <!-- Welcome / Join / Upload Card -->
        <div id="setup-card" class="card">
          <h2 id="setup-title">Streamla Watch Party</h2>
          <p id="movie-status">Ready to connect</p>

          <!-- Viewer Join Section (Always visible!) -->
          <div id="join-section" class="form-group">
            <input
              type="text"
              id="join-room-input"
              placeholder="Room ID"
              style="
                padding: 10px;
                border-radius: 8px;
                border: 1px solid #363b57;
                background: #1a1d29;
                color: #fff;
                width: 80%;
                text-align: center;
                font-size: 1rem;
              "
            />
            <button id="join-btn" class="btn primary" style="width: 80%">
              Join Watch Party
            </button>
          </div>

          <hr
            style="
              border: 0;
              border-top: 1px solid #25283b;
              margin: 20px 0;
              width: 100%;
            "
          />

          <!-- Host Upload Section -->
          <div id="upload-section" class="form-group">
            <span style="font-size: 0.85rem; color: #8f94a6"
              >Hosting on this machine?</span
            >
            <label class="btn-file">
              Choose Movie (.mp4)
              <input type="file" id="movie-input" accept="video/mp4" hidden />
            </label>
            <span
              id="file-name"
              style="font-size: 0.8rem; color: #a5b4fc"
            ></span>
            <button id="upload-btn" class="btn" disabled>Start Hosting</button>
            <div id="upload-progress" class="hidden">
              Uploading movie to LAN...
            </div>
          </div>
        </div>

        <!-- Video Player -->
        <div id="video-wrapper" class="hidden">
          <video id="player" playsinline preload="auto">
            Your browser does not support HTML5 video.
          </video>
          <div class="player-controls-bar">
            <div id="role-tag" class="role-tag" style="position: static;">Viewer Mode (Synced)</div>
            <div class="track-selectors">
              <!-- Audio Track Selection -->
              <div id="audio-track-group" class="selector-group hidden">
                <label for="audio-select">Audio:</label>
                <select id="audio-select" class="track-select">
                  <option value="default">Default</option>
                </select>
              </div>
              <!-- Subtitle Selection -->
              <div id="subtitle-track-group" class="selector-group hidden">
                <label for="subtitle-select">Subtitles:</label>
                <select id="subtitle-select" class="track-select">
                  <option value="off">Off</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
